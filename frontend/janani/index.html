<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANANI AI - Tribal Language Learning Platform</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#064e3b">
  <meta name="description" content="JANANI AI - Multilingual Mother-Tongue Classroom Teaching Assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nirmala+UI:wght@400;700&display=swap" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      height: 100%;
      background-color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #root {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    /* Ol Chiki font fallback */
    @font-face {
      font-family: 'OlChikiFont';
      src: local('Nirmala UI'), local('Segoe UI Historic');
    }
    .ol-chiki {
      font-family: 'OlChikiFont', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.js"></script>
</body>
</html>
